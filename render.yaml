services:
  - type: web
    name: ignite-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port 8000
    envVars:
      - key: NEO4J_URI
        scope: ignite-workflows
        sync: false
      - key: NEO4J_USERNAME
        scope: ignite-workflows
        sync: false
      - key: NEO4J_PASSWORD
        scope: ignite-workflows
        sync: false
      - key: NEO4J_DATABASE
        value: 1f2c19fc
      - key: AQI_LIMIT
        value: "300"
      - key: WORKFLOW_SLUG
        value: ignite-workflows
      - key: RENDER_USE_LOCAL_DEV
        value: "false"

  - type: workflow
    name: ignite-workflows
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python workflow.py
    envVars:
      - key: NEO4J_URI
        scope: ignite-api
        sync: false
      - key: NEO4J_USERNAME
        scope: ignite-api
        sync: false
      - key: NEO4J_PASSWORD
        scope: ignite-api
        sync: false
      - key: NEO4J_DATABASE
        value: 1f2c19fc
      - key: AQI_LIMIT
        value: "300"
    region: oregon

  - type: cron
    name: ignite-refresh-aqi
    schedule: "*/15 * * * *"
    httpMethod: POST
    target:
      type: workflow
      name: ignite-workflows
      taskName: refresh_aqi
